name: Build Oraxen Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Build with Gradle ShadowJar
        run: |
          chmod +x gradlew
          ./gradlew shadowJar -x test --no-daemon -Pcom.github.VolmitSoftware:Iris=https://jitpack.io
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oraxen-Jar
          path: "**/build/libs/*-all.jar"
