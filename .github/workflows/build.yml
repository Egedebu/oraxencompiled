name: Build Oraxen Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Inject JitPack to All Modules
        run: |
          # Eğer settings.gradle.kts (Kotlin) varsa ona ekle, yoksa normal settings.gradle dosyasına ekle
          if [ -f "settings.gradle.kts" ]; then
            echo -e '\npluginManagement { repositories { maven { url = uri("https://jitpack.io") } } }\ndependencyResolutionManagement { repositories { maven { url = uri("https://jitpack.io") } } }' >> settings.gradle.kts
          elif [ -f "settings.gradle" ]; then
            echo -e '\npluginManagement { repositories { maven { url "https://jitpack.io" } } }\ndependencyResolutionManagement { repositories { maven { url "https://jitpack.io" } } }' >> settings.gradle
          fi

      - name: Build with Gradle ShadowJar
        run: |
          chmod +x gradlew
          ./gradlew shadowJar -x test --no-daemon
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oraxen-Jar
          path: "**/build/libs/*-all.jar"
